<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Gradiente de Fundo Profundo Vibrante -->
    <linearGradient id="vbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1638"/>
      <stop offset="50%" stop-color="#140f29"/>
      <stop offset="100%" stop-color="#0a0718"/>
    </linearGradient>

    <!-- Gradiente da Borda Neon Chamativa -->
    <linearGradient id="vbBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Gradiente do Countdown e Brilho -->
    <linearGradient id="vbArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Gradiente da Caneta de Criação (Excalidraw style) -->
    <linearGradient id="vbPenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#ffbd00"/>
    </linearGradient>

    <!-- Efeito de Brilho Neon (Glow) -->
    <filter id="vbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Arredondado com Borda Iluminada -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="url(#vbBgGrad)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" stroke="url(#vbBorderGrad)" stroke-width="2.2"/>

  <!-- Disco Interior Sutil -->
  <circle cx="24" cy="24" r="15" fill="rgba(255, 255, 255, 0.03)"/>

  <!-- Anel de Countdown Circular Neon (270 graus de arco) -->
  <circle cx="24" cy="24" r="14.5" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-dasharray="2 3"/>
  <path d="M 24 9.5 A 14.5 14.5 0 1 1 12 32.5" stroke="url(#vbArcGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#vbGlow)"/>

  <!-- Mini Marcador / Ponteiro no Countdown -->
  <circle cx="24" cy="9.5" r="2.2" fill="#ffffff" filter="url(#vbGlow)"/>

  <!-- Lápis / Caneta Stylus Artística em Diagonal -->
  <g transform="rotate(-18 24 24)">
    <!-- Corpo da Caneta -->
    <path d="M 27 13 L 31 17 L 22 26 L 18 26 L 18 22 Z" fill="url(#vbPenGrad)" filter="url(#vbGlow)"/>
    <!-- Topo da Caneta -->
    <path d="M 29.8 10.2 C 30.8 9.2 32.4 9.2 33.4 10.2 C 34.4 11.2 34.4 12.8 33.4 13.8 L 31 16.2 L 27.4 12.6 Z" fill="#ffd166"/>
    <!-- Ponta Fina da Caneta -->
    <polygon points="18,26 16,28 18,24" fill="#ffffff"/>
  </g>

  <!-- Estrela de Inspiracao / Sparkle Radiante -->
  <path d="M 17 17 C 17 19.2 15.8 20.2 13.5 20.2 C 15.8 20.2 17 21.2 17 23.4 C 17 21.2 18.2 20.2 20.5 20.2 C 18.2 20.2 17 19.2 17 17 Z" fill="#00f2fe" filter="url(#vbGlow)"/>

  <!-- Ponto de Brilho Secundário -->
  <circle cx="34" cy="33" r="1.6" fill="#ff007f" filter="url(#vbGlow)"/>
</svg>
