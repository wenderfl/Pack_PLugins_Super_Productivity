  <style>:root{--bg:#101010;--text:#ffffff;--text-muted:#888888;--accent:#1ed760;--accent-cyan:#38bdf8;--selection:#6965db;--danger:#ef4444;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-mono:'JetBrains Mono',"Fira Code",monospace,Consolas;--font-hand:'Caveat','Kalam','Comic Neue',cursive,sans-serif}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;min-width:100vw;min-height:100vh;background-color:var(--bg);color:var(--text);font-family:var(--font-sans);overflow:auto;user-select:none;-webkit-font-smoothing:antialiased}#canvas{position:absolute;top:0;left:0;min-width:5000px;min-height:5000px;width:100%;height:100%;cursor:default;transform-origin:0 0;transition:transform 0.05s ease-out}.canvas-zoom-controls{position:fixed;bottom:20px;left:20px;display:flex;align-items:center;gap:3px;background:rgba(26,26,26,0.92);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:3px 5px;box-shadow:0 8px 24px rgba(0,0,0,0.5);backdrop-filter:blur(12px);z-index:9990;user-select:none}.canvas-zoom-controls .zoom-btn,.canvas-zoom-controls .zoom-level-btn{background:transparent;border:none;color:#d4d4d8;padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:var(--font-sans);transition:background 0.15s,color 0.15s,transform 0.1s}.canvas-zoom-controls .zoom-btn:hover,.canvas-zoom-controls .zoom-level-btn:hover{background:rgba(255,255,255,0.12);color:#fff}.canvas-zoom-controls .zoom-btn:active,.canvas-zoom-controls .zoom-level-btn:active{transform:scale(0.94)}.canvas-zoom-controls .zoom-level-btn{min-width:48px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px}.context-menu{position:fixed;display:none;flex-direction:column;background:rgba(26,26,26,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.6);backdrop-filter:blur(12px);padding:6px;z-index:9999;min-wi ;border:1px solid rgba(255,255,255,0.16);border-radius:5px;height:24px;padding:0 2px 0 4px;transition:border-color 0.15s,background 0.15s}.font-size-combobox:hover,.font-size-combobox:focus-within{background:rgba(255,255,255,0.14);border-color:var(--selection)}.tb-fs-input{width:32px;background:transparent;border:none;outline:none;color:#ffffff;font-family:var(--font-mono);font-size:11px;font-weight:600;text-align:center;padding:0;-moz-appearance:textfield}.tb-fs-input::-webkit-outer-spin-button,.tb-fs-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.tb-fs-dropdown-btn{position:relative;display:flex;align-items:center;justify-content:center;width:16px;height:20px;cursor:pointer;color:var(--text-muted);border-radius:3px;transition:color 0.15s,background 0.15s}.tb-fs-dropdown-btn:hover{color:#ffffff;background:rgba(255,255,255,0.12)}.tb-fs-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;background:#18181b;color:#ffffff}.tb-fs-select option{background:#18181b;color:#ffffff;padding:4px}.tb-color-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:transform 0.15s,border-color 0.15s;flex-shrink:0}.tb-color-dot:hover{transform:scale(1.2)}.tb-color-dot.active{border-color:#fff !important;transform:scale(1.15)}.tb-bg-pill{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;transition:transform 0.15s;padding:0}.tb-bg-pill:hover{transform:scale(1.2)}.tb-bg-pill.active{border-color:var(--accent) !important;transform:scale(1.15);box-shadow:0 0 0 1px var(--accent)}.simple-dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:10000;display:none;align-items:center;justify-content:center}.simple-dialog{background:#1c1c1c;border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:20px;width:350px;max-width:92vw;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,0.7)}.simple-dialog input{background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 10px;color:#fff;font-size:13px;outline:none;width:100%;min-width:0;box-sizing:border-box}.simple-dialog button#cdConfirmBtn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;box-sizing:border-box;transition:filter 0.15s,transform 0.1s}.simple-dialog button#cdConfirmBtn:hover{filter:brightness(1.1)}.simple-dialog button#cdConfirmBtn:active{transform:scale(0.99)}.color-swatches{display:flex;gap:6px;align-items:center}.color-swatch-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s,border-color 0.15s;flex-shrink:0}.color-swatch-dot:hover{transform:scale(1.15)}.color-swatch-dot.active{border-color:#ffffff;transform:scale(1.1)}.simple-dialog input.color-picker-btn{width:22px !important;height:22px !important;min-width:22px !important;max-width:22px !important;padding:0 !important;border-radius:50% !important;border:1.5px solid rgba(255,255,255,0.3) !important;background:transparent !important;cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none;outline:none;box-shadow:none !important}.color-picker-btn::-webkit-color-swatch-wrapper{padding:0}.color-picker-btn::-webkit-color-swatch{border:none;border-radius:50%}.color-picker-btn::-moz-color-swatch{border:none;border-radius:50%}.date-preset-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.date-preset-chips::-webkit-scrollbar{display:none}.simple-dialog button.preset-chip{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:all 0.15s ease;width:auto !important;line-height:normal}.simple-dialog <body>

  <div id="canvas"></div>

  <div class="context-menu" id="addMenu">
    <button class="menu-item" id="itemAddImage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      <span>Imagem</span>
    </button>
    <button class="menu-item" id="itemAddCountdown">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Countdown</span>
    </button>
    <button class="menu-item" id="itemAddMarkdown">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span>Texto</span>
    </button>
    <button class="menu-item" id="itemAddLine">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><path d="m13 5 6 0 0 6"/></svg>
      <span>Linha</span>
    </button>
  </div>

  <div class="canvas-zoom-controls">
    <button class="zoom-btn" id="btnZoomOut" title="Reduzir Zoom (Alt + Scroll para baixo)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="zoom-level-btn" id="btnZoomReset" title="Redefinir Zoom para 100%">
      <span id="zoomDisplay">100%</span>
    </button>
    <button class="zoom-btn" id="btnZoomIn" title="Aumentar Zoom (Alt + Scroll para cima)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <input type="file" id="filePicker" accept="image/*" style="display: none;">

  <div class="simple-dialog-backdrop" id="countdownDialog">
    <div class="simple-dialog">
      <div style="font-weight: 700; font-size: 15px;" id="cdDialogHeading">Novo Countdown</div>
      <input type="text" id="cdTitleInput" placeholder="Título (ex: Prova, Meta, Férias)">

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 11px; color: var(--text-muted);">Atalhos rápidos:</label>
        <div class="date-preset-chips">
          <button type="button" class="preset-chip" onclick="applyDatePreset('today')">Hoje</button>
          <button type="button" class="preset-chip" onclick="applyDatePreset('tomorrow')">Amanhã</button>
          <button type="button" class="preset-chip" onclick="applyDatePreset('7days')">+7 dias</button>
          <button type="button" class="preset-chip" onclick="applyDatePreset('30days')">+30 dias</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 10px; width: 100%; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; min-width: 0;">
          <label style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Data (dia/mês/ano)</label>
          <div class="segmented-date-wrapper">
            <input type="text" id="cdDayInput" placeholder="DD" maxlength="2" inputmode="numeric" class="date-segment" title="Dia">
            <span class="date-sep">/</span>

        </div>

      <div id="cdDateFeedback"></div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;">
        <span style="font-size: 12px; color: var(--text-muted);">Cor do círculo:</span>

  <script>
    'use strict';
    const STORAGE_KEY = 'vision_board_empty_canvas';
    let cards = [];
    let spawnCoords = { x: 100, y: 100 };
    let selectedCards = new Set();
    let zoomLevel = 1;
    function getSP() {
      if (typeof PluginAPI !== 'undefined' && PluginAPI) return PluginAPI;
      if (typeof window.PluginAPI !== 'undefined' && window.PluginAPI) return window.PluginAPI;
      if (typeof window.superProductivity !== 'undefined' && window.superProductivity) return window.superProductivity;
      try {
        if (window.parent && typeof window.parent.PluginAPI !== 'undefined' && window.parent.PluginAPI) return window.parent.PluginAPI;
        if (window.parent && typeof window.parent.superProductivity !== 'undefined' && window.parent.superProductivity) return window.parent.superProductivity;
      } catch (e) {}
      return null;
    }
    async function persist() {
      const serialized = JSON.stringify(cards);
      try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
      const sp = getSP();
      if (sp && typeof sp.persistDataSynced === 'function') {
        try {
          await sp.persistDataSynced(serialized, 'broaderGoalsDashboardData');
        } catch (e) {
          try { await sp.persistDataSynced(serialized); } catch (err) {}
        }
      }
    }
    function screenToCanvas(clientX, clientY) {
      const canvasRect = canvas.getBoundingClientRect();
      return {
        x: Math.round((clientX - canvasRect.left) / zoomLevel),
        y: Math.round((clientY - canvasRect.top) / zoomLevel)
      };
    }
    function updateCanvasBounds() {
      let maxX = 5000;
      let maxY = 5000;
      cards.forEach(c => {
        const r = (c.x || 0) + (c.width || 300) + 1200;
        const b = (c.y || 0) + (c.height || 200) + 1200;
        if (r > maxX) maxX = r;
        if (b > maxY) maxY = b;
      });
      canvas.style.minWidth = `${maxX}px`;
      canvas.style.minHeight = `${maxY}px`;
    }
    let isViewRestored = false;
    let scrollSaveTimer = null;
    function saveViewPosition() {
      if (!isViewRestored) return;
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem('visionBoard_scrollX', Math.round(window.scrollX).toString());
          localStorage.setItem('visionBoard_scrollY', Math.round(window.scrollY).toString());
          localStorage.setItem('visionBoard_zoom', zoomLevel.toString());
        } catch (e) {}
      }, 80);
    }
    window.addEventListener('scroll', saveViewPosition, { passive: true });
    const saveImmediate = () => {
      if (!isViewRestored) return;
      try {
        localStorage.setItem('visionBoard_scrollX', Math.round(window.scrollX).toString());
        localStorage.setItem('visionBoard_scrollY', Math.round(window.scrollY).toString());
        localStorage.setItem('visionBoard_zoom', zoomLevel.toString());
      } catch (e) {}
    };
    window.addEventListener('beforeunload', saveImmediate);
    window.addEventListener('pagehide', saveImmediate);
    function setZoom(newZoom, focalX = window.innerWidth / 2, focalY = window.innerHeight / 2) {
      const oldZoom = zoomLevel;
      newZoom = Math.min(4.0, Math.max(0.15, Math.round(newZoom * 100) / 100));
      if (Math.abs(newZoom - oldZoom) < 0.005) return;
      const canvasRect = canvas.getBoundingClientRect();
      const canvasX = (focalX - canvasRect.left) / oldZoom;
      const canvasY = (focalY - canvasRect.top) / oldZoom;
      zoomLevel = newZoom;
      canvas.style.transformOrigin = '0 0';
      canvas.style.transform = `scale(${zoomLevel})`;
      const zoomDisplay = document.getElementById('zoomDisplay');
      if (zoomDisplay) {
        zoomDisplay.textContent = `${Math.round(zoomLevel * 100)}%`;
      }
      const targetScrollX = Math.max(0, Math.round(canvasX * zoomLevel - focalX));
      const targetScrollY = Math.max(0, Math.round(canvasY * zoomLevel - focalY));
      window.scrollTo(targetScrollX, targetScrollY);
      try {
        localStorage.setItem('visionBoard_zoom', zoomLevel.toString());
        if (isViewRestored) {
          localStorage.setItem('visionBoard_scrollX', targetScrollX.toString());
          localStorage.setItem('visionBoard_scrollY', targetScrollY.toString());
        }
      } catch (e) {}
    }
    async function load() {
      let loaded = false;
      const sp = getSP();
      if (sp && typeof sp.loadSyncedData === 'function') {
        try {
          let res = await sp.loadSyncedData('broaderGoalsDashboardData');
          if (!res) {
            res = await sp.loadSyncedData();
          }
          if (res) {
            const parsed = typeof res === 'string' ? JSON.parse(res) : res;
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              loaded = true;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch (e) {}
            }
          }
        } catch (e) {}
      }
      if (!loaded) {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
          try {
            const parsed = JSON.parse(local);
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              loaded = true;
              if (sp && typeof sp.persistDataSynced === 'function') {
                try {
                  await sp.persistDataSynced(local, 'broaderGoalsDashboardData');
                } catch (e) {
                  try { await sp.persistDataSynced(local); } catch (err) {}
                }
              }
            }
          } catch (e) {}
        }
      }
      renderCards();
      try {
        const savedZoom = parseFloat(localStorage.getItem('visionBoard_zoom'));
        if (savedZoom && !isNaN(savedZoom) && savedZoom > 0) {
          zoomLevel = Math.min(4.0, Math.max(0.15, Math.round(savedZoom * 100) / 100));
        } else {
          zoomLevel = 1.0;
        }
      } catch (e) {
        zoomLevel = 1.0;
      }
      canvas.style.transition = 'none';
      canvas.style.transformOrigin = '0 0';
      canvas.style.transform = `scale(${zoomLevel})`;
      const zoomDisplay = document.getElementById('zoomDisplay');
      if (zoomDisplay) {
        zoomDisplay.textContent = `${Math.round(zoomLevel * 100)}%`;
      }
      void canvas.offsetHeight;
      setTimeout(() => {
        canvas.style.transition = 'transform 0.05s ease-out';
      }, 100);
      try {
        const savedX = parseFloat(localStorage.getItem('visionBoard_scrollX'));
        const savedY = parseFloat(localStorage.getItem('visionBoard_scrollY'));
        if (!isNaN(savedX) && !isNaN(savedY)) {
          const targetX = Math.max(0, Math.round(savedX));
          const targetY = Math.max(0, Math.round(savedY));
          window.scrollTo(targetX, targetY);
          requestAnimationFrame(() => {
            window.scrollTo(targetX, targetY);
            setTimeout(() => {
              window.scrollTo(targetX, targetY);
              isViewRestored = true;
            }, 50);
          });
        } else {
          isViewRestored = true;
        }
      } catch (e) {
        isViewRestored = true;
      }
    }
    const canvas = document.getElementById('canvas');
    const addMenu = document.getElementById('addMenu');
    const filePicker = document.getElementById('filePicker');
    const countdownDialog = document.getElementById('countdownDialog');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomReset = document.getElementById('btnZoomReset');
    const smartGuideV = document.createElement('div');
    smartGuideV.className = 'smart-guide vertical';
    canvas.appendChild(smartGuideV);
    const smartGuideH = document.createElement('div');
    smartGuideH.className = 'smart-guide horizontal';
    canvas.appendChild(smartGuideH);
    function hideSmartGuides() {
      smartGuideV.style.display = 'none';
      smartGuideH.style.display = 'none';
    }
    function computeSnapping(primaryCard, primaryEl, rawX, rawY, otherCards) {
      const SNAP_DISTANCE = 7;
      const pw = primaryEl ? primaryEl.offsetWidth : (primaryCard.width || 200);
      const ph = primaryEl ? primaryEl.offsetHeight : (primaryCard.height || 100);
      const myX = [
        { type: 'left', val: rawX },
        { type: 'center', val: rawX + pw / 2 },
        { type: 'right', val: rawX + pw }
      ];
      const myY = [
        { type: 'top', val: rawY },
        { type: 'center', val: rawY + ph / 2 },
        { type: 'bottom', val: rawY + ph }
      ];
      let bestSnapX = null;
      let minDiffX = SNAP_DISTANCE + 1;
      let bestSnapY = null;
      let minDiffY = SNAP_DISTANCE + 1;
      otherCards.forEach(other => {
        const otherEl = document.getElementById(other.id);
        const ow = otherEl ? otherEl.offsetWidth : (other.width || 200);
        const oh = otherEl ? otherEl.offsetHeight : (other.height || 100);
        const otherX = [
          other.x,
          other.x + ow / 2,
          other.x + ow
        ];
        const otherY = [
          other.y,
          other.y + oh / 2,
          other.y + oh
        ];
        myX.forEach(my => {
          otherX.forEach(otVal => {
            const diff = otVal - my.val;
            if (Math.abs(diff) <= SNAP_DISTANCE && Math.abs(diff) < minDiffX) {
              minDiffX = Math.abs(diff);
              bestSnapX = {
                guideCoord: otVal,
                snapDelta: diff
              };
            }
          });
        });
        myY.forEach(my => {
          otherY.forEach(otVal => {
            const diff = otVal - my.val;
            if (Math.abs(diff) <= SNAP_DISTANCE && Math.abs(diff) < minDiffY) {
              minDiffY = Math.abs(diff);
              bestSnapY = {
                guideCoord: otVal,
                snapDelta: diff
              };
            }
          });
        });
      });
      return { bestSnapX, bestSnapY };
    }
    if (btnZoomOut) btnZoomOut.onclick = () => setZoom(zoomLevel / 1.15);
    if (btnZoomIn) btnZoomIn.onclick = () => setZoom(zoomLevel * 1.15);
    if (btnZoomReset) btnZoomReset.onclick = () => setZoom(1.0);
    window.addEventListener('wheel', (e) => {
      if (e.altKey || (e.ctrlKey && !e.shiftKey)) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
        setZoom(zoomLevel * factor, e.clientX, e.clientY);
      }
    }, { passive: false });
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let panScrollStartX = 0, panScrollStartY = 0;
    let isSpacePressed = false;
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
        if (!isSpacePressed) {
          isSpacePressed = true;
          document.body.style.cursor = 'grab';
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        if (!isPanning) document.body.style.cursor = '';
      }
    });
    window.addEventListener('mousedown', (e) => {
      if (e.button === 1 || (e.button === 0 && isSpacePressed)) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panScrollStartX = window.scrollX;
        panScrollStartY = window.scrollY;
        document.body.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        window.scrollTo(panScrollStartX - dx, panScrollStartY - dy);
      }
    });
    window.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        document.body.style.cursor = isSpacePressed ? 'grab' : '';
        saveViewPosition();
      }
    });
    window.addEventListener('mousedown', (e) => {
      if (isSpacePressed || e.button === 1) return;
      const clickedCard = e.target.closest('.board-card');
      const isMultiKey = e.ctrlKey || e.metaKey || e.shiftKey;
      if (clickedCard) {
        if (isMultiKey) {
          toggleCardSelection(clickedCard.id);
        } else {
          if (!selectedCards.has(clickedCard.id)) {
            selectCard(clickedCard.id);
          }
        }
        return;
      }
      if (e.target.closest('.simple-dialog') || e.target.closest('.context-menu') || e.target.closest('.canvas-zoom-controls')) {
        return;
      }
      if (!isMultiKey) {
        selectCard(null);
      }
      if (e.button === 0 || e.button === 2) {
        if (e.button === 2) e.preventDefault();
        spawnCoords = screenToCanvas(e.clientX, e.clientY);
        addMenu.style.left = `${e.clientX}px`;
        addMenu.style.top = `${e.clientY}px`;
        addMenu.style.display = 'flex';
      }
    });
    function selectCard(id) {
      selectedCards.clear();
      if (id) {
        selectedCards.add(id);
      }
      updateSelectionUi();
    }
    function toggleCardSelection(id) {
      if (selectedCards.has(id)) {
        selectedCards.delete(id);
      } else {
        selectedCards.add(id);
      }
      updateSelectionUi();
    }
    function updateSelectionUi() {
      const isMulti = selectedCards.size > 1;
      document.body.classList.toggle('multi-selection', isMulti);
      document.querySelectorAll('.board-card').forEach(el => {
        if (selectedCards.has(el.id)) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
    }
    function removeSelectedCards() {
      if (selectedCards.size === 0) return;
      cards = cards.filter(c => !selectedCards.has(c.id));
      selectedCards.clear();
      persist();
      renderCards();
    }
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedCards.size > 0) {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (document.activeElement.isContentEditable) return;
        removeSelectedCards();
      }
    });
    window.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.board-card input, .board-card textarea, [contenteditable="true"]')) {
        e.preventDefault();
      }
    });
    window.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu')) {
        addMenu.style.display = 'none';
      }
    });
    document.getElementById('itemAddImage').onclick = () => {
      addMenu.style.display = 'none';
      filePicker.click();
    };
    function optimizeImage(dataUrl, maxDim = 1200, quality = 0.82) {
      return new Promise((resolve) => {
        if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')) {
          return resolve(dataUrl);
        }
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w <= maxDim && h <= maxDim && dataUrl.length < 250000) {
            return resolve(dataUrl);
          }
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }
    filePicker.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const opt = await optimizeImage(evt.target.result);
        createImageCard(opt, file.name.replace(/\.[^/.]+$/, ''), spawnCoords.x, spawnCoords.y);
      };
      reader.readAsDataURL(file);
      filePicker.value = '';
    };
    function createImageCard(imageUrl, caption, x, y) {
      const card = {
        id: 'card_' + Date.now(),
        type: 'image',
        x,
        y,
        width: 280,
        height: 220,
        imageUrl,
        caption: caption || ''
      };
      cards.push(card);
      persist();
      renderCards();
      selectCard(card.id);
    }
    const COUNTDOWN_COLORS = ['#1ed760', '#38bdf8', '#a855f7', '#f59e0b', '#f43f5e', '#ffffff'];
    let selectedCountdownColor = '#1ed760';
    let editingCountdownId = null;
    function renderCdColorSwatches() {
      const container = document.getElementById('cdColorSwatches');
      if (!container) return;
      container.innerHTML = '';
      COUNTDOWN_COLORS.forEach(c => {
        const dot = document.createElement('div');
        dot.className = 'color-swatch-dot' + (selectedCountdownColor.toLowerCase() === c.toLowerCase() ? ' active' : '');
        dot.style.backgroundColor = c;
        dot.onclick = () => {
          selectedCountdownColor = c;
          document.getElementById('cdCustomColorInput').value = c;
          renderCdColorSwatches();
        };
        container.appendChild(dot);
      });
    }
    document.getElementById('cdCustomColorInput').oninput = (e) => {
      selectedCountdownColor = e.target.value;
      renderCdColorSwatches();
    };
    const cdDayInput = document.getElementById('cdDayInput');
    const cdMonthInput = document.getElementById('cdMonthInput');
    const cdYearInput = document.getElementById('cdYearInput');
    const cdTimeInput = document.getElementById('cdTimeInput');
    function setFormattedDate(d, m, y) {
      if (cdDayInput) cdDayInput.value = d ? String(d).padStart(2, '0').slice(-2) : '';
      if (cdMonthInput) cdMonthInput.value = m ? String(m).padStart(2, '0').slice(-2) : '';
      if (cdYearInput) cdYearInput.value = y ? String(y).slice(-4) : '';
      syncPresetChipHighlight();
      updateDateFeedback();
    }
    function getFormattedDate() {
      const d = cdDayInput ? cdDayInput.value.trim().padStart(2, '0') : '';
      const m = cdMonthInput ? cdMonthInput.value.trim().padStart(2, '0') : '';
      const y = cdYearInput ? cdYearInput.value.trim() : '';
      if (!d || !m || !y || y.length < 4) return null;
      return `${d}/${m}/${y}`;
    }
    function openCountdownDialog(card = null) {
      if (card) {
        editingCountdownId = card.id;
        document.getElementById('cdDialogHeading').textContent = 'Editar Countdown';
        document.getElementById('cdTitleInput').value = card.title || '';
        const ts = parseTargetDate(card.targetDate);
        if (ts) {
          const dt = new Date(ts);
          const d = String(dt.getDate()).padStart(2, '0');
          const m = String(dt.getMonth() + 1).padStart(2, '0');
          const y = dt.getFullYear();
          const h = String(dt.getHours()).padStart(2, '0');
          const min = String(dt.getMinutes()).padStart(2, '0');
          setFormattedDate(d, m, y);
          cdTimeInput.value = `${h}:${min}`;
        } else {
          setFormattedDate('', '', '');
          cdTimeInput.value = '23:59';
        }
        selectedCountdownColor = card.color || '#1ed760';
      } else {
        editingCountdownId = null;
        document.getElementById('cdDialogHeading').textContent = 'Novo Countdown';
        document.getElementById('cdTitleInput').value = '';
        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        setFormattedDate(d, m, y);
        cdTimeInput.value = '23:59';
        selectedCountdownColor = '#1ed760';
      }
      document.getElementById('cdCustomColorInput').value = selectedCountdownColor;
      renderCdColorSwatches();
      syncPresetChipHighlight();
      updateDateFeedback();
      countdownDialog.style.display = 'flex';
      document.getElementById('cdTitleInput').focus();
    }
    window.applyDatePreset = function(type) {
      const dt = new Date();
      if (type === 'tomorrow') {
        dt.setDate(dt.getDate() + 1);
      } else if (type === '7days') {
        dt.setDate(dt.getDate() + 7);
      } else if (type === '30days') {
        dt.setDate(dt.getDate() + 30);
      }
      const d = String(dt.getDate()).padStart(2, '0');
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const y = dt.getFullYear();
      setFormattedDate(d, m, y);
      syncPresetChipHighlight(type);
      updateDateFeedback();
    };
    function syncPresetChipHighlight(activeType = null) {
      const curDate = getFormattedDate();
      const now = new Date();
      const formatDate = (dateObj) => {
        const d = String(dateObj.getDate()).padStart(2, '0');
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const y = dateObj.getFullYear();
        return `${d}/${m}/${y}`;
      };
      const presetMap = {
        today: formatDate(now),
        tomorrow: formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1)),
        '7days': formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7)),
        '30days': formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 30))
      };
      document.querySelectorAll('.preset-chip').forEach(chip => {
        const onclickAttr = chip.getAttribute('onclick') || '';
        let isMatch = false;
        for (const [key, val] of Object.entries(presetMap)) {
          if (onclickAttr.includes(`'${key}'`) && curDate === val) {
            isMatch = true;
            break;
          }
        }
        chip.classList.toggle('active', isMatch || (activeType && onclickAttr.includes(`'${activeType}'`)));
      });
    }
    const cdCalendarBtn = document.getElementById('cdCalendarBtn');
    const cdHiddenDatePicker = document.getElementById('cdHiddenDatePicker');
    if (cdCalendarBtn && cdHiddenDatePicker) {
      cdCalendarBtn.onclick = () => {
        const curDate = getFormattedDate();
        if (curDate) {
          const [d, m, y] = curDate.split('/');
          cdHiddenDatePicker.value = `${y}-${m}-${d}`;
        }
        if (typeof cdHiddenDatePicker.showPicker === 'function') {
          try {
            cdHiddenDatePicker.showPicker();
          } catch (e) {
            cdHiddenDatePicker.focus();
            cdHiddenDatePicker.click();
          }
        } else {
          cdHiddenDatePicker.focus();
          cdHiddenDatePicker.click();
        }

      if (!text || text.trim() === '' || text === '<br>' || text === '<p><br></p>') return '';
      let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      escaped = escaped.replace(/&lt;(\/?(?:span|strong|b|em|i|u|s|mark|code|br|p|h1|h2|h3|blockquote|hr)(?:\s+[^&>]*?)?)&gt;/gi, '<$1>');
      escaped = escaped.replace(/^(?:---|___|\*\*\*)\s*$/gim, '<hr class="md-hr">');
      escaped = escaped.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      escaped = escaped.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      escaped = escaped.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      escaped = escaped.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
      escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
      escaped = escaped.replace(/~~(.*?)~~/g, '<s>$1</s>');
      escaped = escaped.replace(/==(.*?)==/g, '<mark style="background: rgba(254, 240, 138, 0.45); color: inherit; padding: 1px 4px; border-radius: 3px;">$1</mark>');
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>'); const lines = escaped.split('\n'); return lines.map((line, idx) => { const task = line.match(/^(\s*)-\s+\[([ xX])\]\s+(.*)/); if (task) { const checked = task[2].toLowerCase() === 'x'; return `<div class="markdown-task ${checked ? 'checked' : ''}" onclick="toggleTask('${cardId}', ${idx})">
            <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${cardId}', ${idx})">
            <span>${task[3]}</span>
          </div>`;
        }
        const trimmed = line.trim();
        if (trimmed.startsWith('<p') || trimmed.startsWith('<h') || trimmed.startsWith('<div') || trimmed.startsWith('<blockquote') || trimmed.startsWith('<hr')) {
          return line;
        }
        return `<p>${line || '&nbsp;'}</p>`;
      }).join('');
    }
    window.toggleTask = function(cardId, lineIdx) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;
      const lines = card.content.split('\n');
      if (lines[lineIdx]) {
        if (lines[lineIdx].includes('- [ ]')) lines[lineIdx] = lines[lineIdx].replace('- [ ]', '- [x]');
        else if (lines[lineIdx].includes('- [x]') || lines[lineIdx].includes('- [X]')) lines[lineIdx] = lines[lineIdx].replace(/- \[[xX]\]/, '- [ ]');
        card.content = lines.join('\n');
        persist();
        renderCards();
      }
    };
    function updateCountdowns() {
      const circumference = 301.6;
      cards.forEach(card => {
        if (card.type === 'countdown') {
          const targetTs = parseTargetDate(card.targetDate);
          const dialEl = document.getElementById(`dial-${card.id}`);
          const numEl = document.getElementById(`c-num-${card.id}`);
          const unitEl = document.getElementById(`c-unit-${card.id}`);
          const barEl = document.getElementById(`c-bar-${card.id}`);
          if (!numEl || !unitEl) return;
          if (!targetTs || isNaN(targetTs)) {
            numEl.textContent = '--';
            unitEl.textContent = 'DATA?';
            if (barEl) barEl.style.strokeDashoffset = circumference;
            return;
          }
          const diff = targetTs - Date.now();
          if (barEl) {
            barEl.style.stroke = card.color || '#1ed760';
          }
          if (diff <= 0) {
            numEl.textContent = '0';
            unitEl.textContent = 'HOJE';
            if (dialEl) dialEl.className = 'circle-dial expired';
            if (barEl) {
              barEl.style.strokeDashoffset = '0';
              barEl.style.stroke = 'rgba(255, 255, 255, 0.2)';
            }
            return;
          }
          const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
          const totalHours = Math.floor(diff / (1000 * 60 * 60));
          if (totalDays >= 1) {
            numEl.textContent = String(totalDays).padStart(2, '0');
            unitEl.textContent = totalDays === 1 ? 'DIA' : 'DIAS';
            if (dialEl) dialEl.className = 'circle-dial';
            if (barEl) barEl.style.strokeDashoffset = '0';
          } else {
            if (dialEl) dialEl.className = 'circle-dial final-hours';
            if (totalHours >= 1) {
              numEl.textContent = String(totalHours).padStart(2, '0');
              unitEl.textContent = totalHours === 1 ? 'HORA' : 'HORAS';
              const offset = circumference * (1 - (totalHours / 24));
              if (barEl) barEl.style.strokeDashoffset = offset;
            } else {
              const mins = Math.max(1, Math.floor(diff / (1000 * 60)));
              numEl.textContent = String(mins).padStart(2, '0');
              unitEl.textContent = 'MIN';
              const offset = circumference * (1 - (mins / 60));
              if (barEl) barEl.style.strokeDashoffset = offset;
            }
          }
        }
      });
    }
    setInterval(updateCountdowns, 1000);
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          const pos = screenToCanvas(e.clientX, e.clientY);
          const reader = new FileReader();
          reader.onload = (evt) => {
            createImageCard(evt.target.result, file.name.replace(/\.[^/.]+$/, ''), pos.x, pos.y);
          };
          reader.readAsDataURL(file);
        }
      }
    });
    window.addEventListener('paste', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const opt = await optimizeImage(evt.target.result);
              createImageCard(opt, 'Imagem Colada', 150, 150);
            };
            reader.readAsDataURL(file);
            break;
          }
        }
      }
    });
    function initSyncListeners() {
      const sp = getSP();
      if (sp && typeof sp.registerHook === 'function') {
        try {
          sp.registerHook('persistedDataChanged', () => {
            load();
          });
        } catch (e) {}
      }
      window.addEventListener('visibilitychange', () => {
        if (!document.hidden) load();
      });
      window.addEventListener('focus', () => {
        load();
      });
    }
    initSyncListeners();
    load();
    if (!getSP()) {
      setTimeout(() => { if (getSP()) { initSyncListeners(); load(); } }, 200);
      setTimeout(() => { if (getSP()) { initSyncListeners(); load(); } }, 800);
    }
  </script>
</body>
