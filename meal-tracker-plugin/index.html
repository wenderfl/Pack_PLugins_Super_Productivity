<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refeições</title>
  <style>
    :root {
      --sp-black: #121212;
      --sp-elevated: #181818;
      --sp-highlight: #282828;
      --sp-subtle: #222222;
      --sp-green: #1ed760;
      --sp-green-hover: #1fdf64;
      --sp-green-press: #169c46;
      --sp-text: #ffffff;
      --sp-text-sub: #b3b3b3;
      --sp-text-muted: #6a6a6a;
      --font: -apple-system, BlinkMacSystemFont, "Circular", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--sp-black);
      color: var(--sp-text);
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Spotify Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--sp-green);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(30, 215, 96, 0.3);
    }

    .brand h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .stats-pills {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-pill {
      background: var(--sp-elevated);
      border-radius: 500px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--sp-text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill strong {
      color: var(--sp-text);
      font-weight: 700;
    }

    /* Main Control Box */
    .control-card {
      background: var(--sp-elevated);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: background-color 0.2s ease;
    }

    /* Action Row: Green Pill Button + Live Clock Pill */
    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-add {
      flex: 1;
      height: 46px;
      background: var(--sp-green);
      color: #000000;
      border: none;
      border-radius: 500px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(30, 215, 96, 0.25);
    }

    .btn-add:hover {
      background: var(--sp-green-hover);
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(30, 215, 96, 0.35);
    }

    .btn-add:active {
      background: var(--sp-green-press);
      transform: scale(0.99);
    }

    /* Live Clock Badge */
    .clock-pill {
      height: 46px;
      padding: 0 18px;
      background: var(--sp-subtle);
      border-radius: 500px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sp-green);
      box-shadow: 0 0 8px var(--sp-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .clock-digits {
      font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, monospace;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--sp-text);
      letter-spacing: 0.04em;
    }

    /* Category Filter Chips */
    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .category-chip {
      background: var(--sp-subtle);
      color: var(--sp-text);
      border: none;
      border-radius: 500px;
      padding: 7px 15px;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .category-chip svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .category-chip:hover {
      background: var(--sp-highlight);
    }

    .category-chip.active {
      background: #ffffff;
      color: #000000;
    }

    .category-chip.active svg {
      stroke: #000000;
    }

    /* Input Controls */
    .inputs-row {
      display: flex;
      gap: 10px;
    }

    .sp-input {
      flex: 1;
      height: 40px;
      background: var(--sp-subtle);
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      color: var(--sp-text);
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .sp-input::placeholder {
      color: var(--sp-text-muted);
    }

    .sp-input:focus {
      background: var(--sp-highlight);
      box-shadow: 0 0 0 1px var(--sp-green);
    }

    .time-input {
      width: 105px;
      height: 40px;
      background: var(--sp-subtle);
      border: none;
      border-radius: 8px;
      padding: 0 10px;
      color: var(--sp-text-sub);
      font-family: ui-monospace, monospace;
      font-size: 0.82rem;
      outline: none;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .time-input:focus {
      background: var(--sp-highlight);
      box-shadow: 0 0 0 1px var(--sp-green);
      color: #ffffff;
    }

    /* Quick Preset Tags */
    .preset-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-pill {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--sp-text-sub);
      border-radius: 500px;
      padding: 3px 10px;
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-pill:hover {
      background: var(--sp-highlight);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Playlist-like History Section */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--sp-text-muted);
      margin-bottom: 8px;
      padding-left: 6px;
    }

    .tracklist {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      cursor: default;
    }

    .track-row:hover {
      background: var(--sp-elevated);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .track-time {
      font-family: ui-monospace, monospace;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--sp-text-sub);
      width: 48px;
      flex-shrink: 0;
    }

    .track-row:hover .track-time {
      color: var(--sp-green);
    }

    .track-category-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--sp-subtle);
      color: var(--sp-text-sub);
      flex-shrink: 0;
    }

    .track-desc {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--sp-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: var(--sp-text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s, color 0.15s, background-color 0.15s;
    }

    .track-row:hover .btn-remove {
      opacity: 1;
    }

    .btn-remove:hover {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.1);
    }

    .btn-remove svg {
      width: 14px;
      height: 14px;
    }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--sp-text-muted);
      font-size: 0.88rem;
      border-radius: 8px;
      background: var(--sp-elevated);
    }

    /* Spotify Floating Toast */
    .sp-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--sp-highlight);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 500px;
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
      pointer-events: none;
    }

    .sp-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .sp-toast-check {
      color: var(--sp-green);
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/>
            <path d="M15 2v10"/>
            <path d="M12 2v20"/>
            <path d="M6 2v20"/>
            <path d="M3 6h6"/>
          </svg>
        </div>
        <h1>Refeições</h1>
      </div>

      <div class="stats-pills">
        <div class="stat-pill">
          <span>Hoje</span>
          <strong id="statCount">0</strong>
        </div>
        <div class="stat-pill">
          <span>Última</span>
          <strong id="statLast">--:--</strong>
        </div>
      </div>
    </header>

    <!-- Main Card -->
    <section class="control-card">
      <!-- Action Row: Green Pill Button + Live Clock -->
      <div class="action-row">
        <button id="addBtn" class="btn-add">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Adicionar</span>
        </button>

        <div class="clock-pill" title="Horário Atual">
          <div class="clock-dot"></div>
          <span id="clockDigits" class="clock-digits">00:00:00</span>
        </div>
      </div>

      <!-- Categories in Spotify Pill Chips -->
      <div class="category-chips">
        <button type="button" class="category-chip active" data-type="Café">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
          Café
        </button>

        <button type="button" class="category-chip" data-type="Almoço">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
          </svg>
          Almoço
        </button>

        <button type="button" class="category-chip" data-type="Lanche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path>
            <path d="M10 2c1 .5 2 2 2 5"></path>
          </svg>
          Lanche
        </button>

        <button type="button" class="category-chip" data-type="Jantar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          Jantar
        </button>

        <button type="button" class="category-chip" data-type="Treino">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          Treino
        </button>
      </div>

      <!-- Inputs -->
      <div class="inputs-row">
        <input type="text" id="foodInput" class="sp-input" placeholder="O que você comeu ou bebeu?" autocomplete="off">
        <input type="time" id="timeInput" class="time-input" step="1" title="Horário opcional">
      </div>

      <!-- Presets -->
      <div class="preset-tags">
        <button type="button" class="preset-pill" data-food="Café puro">Café puro</button>
        <button type="button" class="preset-pill" data-food="Ovos mexidos">Ovos</button>
        <button type="button" class="preset-pill" data-food="Arroz e feijão">Arroz e feijão</button>
        <button type="button" class="preset-pill" data-food="Frango grelhado">Frango</button>
        <button type="button" class="preset-pill" data-food="Whey protein">Whey</button>
        <button type="button" class="preset-pill" data-food="Fruta">Fruta</button>
        <button type="button" class="preset-pill" data-food="Água 500ml">Água</button>
      </div>
    </section>

    <!-- Tracklist (History) -->
    <section>
      <div class="section-title">Histórico de Hoje</div>
      <div id="tracklist" class="tracklist"></div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast" class="sp-toast">
    <div class="sp-toast-check">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span id="toastText">Adicionado</span>
  </div>

  <script>
    let meals = [];
    let activeCategory = 'Café';
    const STORAGE_KEY = 'sp_spotify_meals_v1';

    const clockDigits = document.getElementById('clockDigits');
    const timeInput = document.getElementById('timeInput');
    const foodInput = document.getElementById('foodInput');
    const addBtn = document.getElementById('addBtn');
    const tracklist = document.getElementById('tracklist');
    const statCount = document.getElementById('statCount');
    const statLast = document.getElementById('statLast');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    // Live clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      clockDigits.textContent = `${h}:${m}:${s}`;
      if (!timeInput.value) {
        timeInput.placeholder = `${h}:${m}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Category chips
    document.querySelectorAll('.category-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCategory = chip.getAttribute('data-type');
      });
    });

    // Presets
    document.querySelectorAll('.preset-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-food');
        foodInput.value = foodInput.value ? `${foodInput.value}, ${val}` : val;
        foodInput.focus();
      });
    });

    function getSP() {
      return (typeof PluginAPI !== 'undefined') ? PluginAPI : (window.parent && window.parent.PluginAPI);
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);

      const sp = getSP();
      if (sp && typeof sp.showSnack === 'function') {
        sp.showSnack({ msg: msg, type: 'SUCCESS' });
      }
    }

    async function saveMeals() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
      const sp = getSP();
      if (sp && typeof sp.persistDataSynced === 'function') {
        try {
          await sp.persistDataSynced(JSON.stringify(meals), 'spotify_meals');
        } catch (e) {}
      }
    }

    async function loadMeals() {
      const sp = getSP();
      let loaded = false;
      if (sp && typeof sp.loadSyncedData === 'function') {
        try {
          const res = await sp.loadSyncedData('spotify_meals');
          if (res) {
            meals = JSON.parse(res);
            loaded = true;
          }
        } catch (e) {}
      }
      if (!loaded) {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
          try { meals = JSON.parse(local); } catch (e) { meals = []; }
        }
      }
      render();
    }

    function addMeal() {
      const now = new Date();
      let timeVal = timeInput.value;
      if (!timeVal) {
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        timeVal = `${h}:${m}`;
      } else {
        timeVal = timeVal.slice(0, 5);
      }

      const food = foodInput.value.trim() || activeCategory;
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const entry = {
        id: 'sp_m_' + Date.now(),
        date: today,
        time: timeVal,
        category: activeCategory,
        food: food
      };

      meals.unshift(entry);
      saveMeals();

      const sp = getSP();
      if (sp && typeof sp.addTask === 'function') {
        try {
          sp.addTask({
            title: `Refeição [${timeVal}]: ${food}`,
            isDone: true
          });
        } catch (e) {}
      }

      showToast(`${activeCategory} [${timeVal}] adicionado`);
      foodInput.value = '';
      timeInput.value = '';
      render();
    }

    addBtn.addEventListener('click', addMeal);
    foodInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addMeal();
    });

    window.removeMeal = function(id) {
      meals = meals.filter(m => m.id !== id);
      saveMeals();
      render();
    };

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function render() {
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const todayMeals = meals.filter(m => m.date === today);

      statCount.textContent = todayMeals.length;
      statLast.textContent = todayMeals.length > 0 ? todayMeals[0].time : '--:--';

      if (meals.length === 0) {
        tracklist.innerHTML = '<div class="empty-state">Nenhuma refeição registrada</div>';
        return;
      }

      tracklist.innerHTML = meals.map(m => `
        <div class="track-row">
          <div class="track-left">
            <span class="track-time">${m.time}</span>
            <span class="track-category-tag">${escapeHtml(m.category)}</span>
            <span class="track-desc">${escapeHtml(m.food)}</span>
          </div>
          <button class="btn-remove" title="Remover" onclick="removeMeal('${m.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      `).join('');
    }

    loadMeals();
  </script>
</body>
</html>
